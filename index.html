<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ lý Xây dựng Pi - Full Update</title>
    <style>
        :root { --pi-purple: #673ab7; --pi-gold: #ffa000; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; line-height: 1.6; padding: 10px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: var(--pi-purple); text-align: center; border-bottom: 2px solid var(--pi-gold); padding-bottom: 10px; }
        .section-title { color: var(--pi-purple); font-weight: bold; margin-top: 20px; border-left: 4px solid var(--pi-gold); padding-left: 10px; }
        .question-group { margin-bottom: 15px; padding: 15px; border: 1px solid #eee; border-radius: 10px; background: #fafafa; }
        .question-group p { font-weight: bold; margin-top: 0; color: #555; font-size: 0.95rem; }
        label { display: block; margin: 8px 0; cursor: pointer; font-size: 0.9rem; }
        input[type="radio"] { margin-right: 10px; accent-color: var(--pi-purple); }
        .btn-analyze { display: block; width: 100%; background: var(--pi-purple); color: white; border: none; padding: 15px; font-size: 1.1rem; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        #result { margin-top: 25px; padding: 20px; border-radius: 10px; display: none; }
        .warning { background: #ffebee; border-left: 5px solid #d32f2f; color: #b71c1c; }
        .success { background: #e8f5e9; border-left: 5px solid #2e7d32; color: #1b5e20; }
        .info-box { font-size: 0.85rem; margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 10px; text-align: center; color: #777; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏗️ TRỢ LÝ XÂY DỰNG PI</h2>
    
    <div id="quiz">
        <div class="section-title">I. PHÁP LÝ & QUY HOẠCH</div>
        <div class="question-group">
            <p>1. Tình trạng chủ quyền lô đất?</p>
            <label><input type="radio" name="phaply" value="A"> Sổ hồng chính quy, đất ở 100%</label>
            <label><input type="radio" name="phaply" value="B"> Sổ cũ/Chưa lên thổ cư hết</label>
            <label><input type="radio" name="phaply" value="C"> Giấy tay/Đang tranh chấp</label>
        </div>

        <div class="question-group">
            <p>2. Giấy phép xây dựng (GPXD)?</p>
            <label><input type="radio" name="gpxd" value="A"> Đã có giấy phép chính thức</label>
            <label><input type="radio" name="gpxd" value="B"> Đang nộp hồ sơ chờ duyệt</label>
            <label><input type="radio" name="gpxd" value="C"> Chưa xin phép xây dựng</label>
        </div>

        <div class="question-group">
            <p>3. Kiểm tra mật độ & lộ giới?</p>
            <label><input type="radio" name="quyhoach" value="A"> Đã rõ khoảng lùi/mật độ</label>
            <label><input type="radio" name="quyhoach" value="B"> Chưa rõ lô đất bị lùi bao nhiêu</label>
        </div>

        <div class="section-title">II. KỸ THUẬT & RỦI RO</div>
        <div class="question-group">
            <p>4. Vị trí tiếp giáp (Tứ cận)?</p>
            <label><input type="radio" name="tucan" value="A"> Đất trống thoáng đãng</label>
            <label><input type="radio" name="tucan" value="B"> Giáp nhà dân xung quanh</label>
            <label><input type="radio" name="tucan" value="C"> Kẹp giữa 2 nhà cao tầng</label>
        </div>

        <div class="question-group">
            <p>5. Bảo hiểm công trình?</p>
            <label><input type="radio" name="baohiem" value="yes"> Đã có/Sẽ mua bảo hiểm</label>
            <label><input type="radio" name="baohiem" value="no"> Không định mua bảo hiểm</label>
        </div>

        <button class="btn-analyze" onclick="analyze()">PHÂN TÍCH KỊCH BẢN</button>
    </div>

    <div id="result"></div>
    <div class="info-box">Dự án phát triển bởi Affiliate Studio Pi</div>
</div>

<script>
function analyze() {
    // Lấy dữ liệu
    const pl = document.querySelector('input[name="phaply"]:checked')?.value;
    const gp = document.querySelector('input[name="gpxd"]:checked')?.value;
    const qh = document.querySelector('input[name="quyhoach"]:checked')?.value;
    const tc = document.querySelector('input[name="tucan"]:checked')?.value;
    const bh = document.querySelector('input[name="baohiem"]:checked')?.value;

    // Kiểm tra đầu vào
    if (!pl || !gp || !qh || !tc || !bh) {
        alert("Anh Long ơi, điền đủ các mục em mới phân tích chuẩn được ạ!");
        return;
    }

    const resDiv = document.getElementById('result');
    resDiv.style.display = "block";
    let output = "<h3>📊 KẾT QUẢ PHÂN TÍCH</h3>";
    let isWarning = false;

    // Logic xử lý
    if (pl === 'C' || gp === 'C') {
        output += "• <b>RỦI RO PHÁP LÝ:</b> Nguy cơ bị đình chỉ hoặc cưỡng chế cực cao. Anh nên dừng lại để hoàn thiện giấy tờ.<br><br>";
        isWarning = true;
    }

    if (tc === 'C' && bh === 'no') {
        output += "• <b>RỦI RO THI CÔNG:</b> Nhà kẹp sườn rất dễ làm lún nứt hàng xóm. Anh BẮT BUỘC phải mua bảo hiểm và chụp ảnh hiện trạng xung quanh.<br><br>";
        isWarning = true;
    }

    if (qh === 'B') {
        output += "• <b>LƯU Ý QUY HOẠCH:</b> Cần xác định rõ lộ giới để tránh việc sau này phải đập bỏ phần xây lấn ranh.<br><br>";
        isWarning = true;
    }

    if (!isWarning) {
        resDiv.className = "success";
        output += "✅ <b>AN TOÀN:</b> Hồ sơ và điều kiện của anh rất tốt. Anh có thể chuẩn bị khởi công ngay!";
    } else {
        resDiv.className = "warning";
        output += "⚠️ <b>KHUYÊN DÙNG:</b> Anh nên xử lý các điểm đỏ phía trên trước khi đổ móng.";
    }

    resDiv.innerHTML = output;
}
</script>

</body>
</html>
